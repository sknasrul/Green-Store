<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Home</title>
<style>
#hm{--ac:var(--p,#0b57d0);--oa:var(--on-p,#fff);--su:var(--sf,#e9eef6);--ct:var(--sc,#d3e3fd);--oc:var(--on-sc,#041e49);--mu:var(--mut,#444746);--ln:#747775;--e:var(--ease,cubic-bezier(.2,0,0,1));--b:calc(var(--nh,60px) + 8px);
--tv:oklch(.94 .05 150);--tf:oklch(.94 .04 235);--tg:oklch(.95 .06 85);--of:oklch(.52 .14 150);
padding-bottom:96px;color:var(--fg,#1f1f1f);font:400 14px/20px "Google Sans",Roboto,"Noto Sans Bengali",system-ui,sans-serif;-webkit-user-select:none;user-select:none}
@media(prefers-color-scheme:dark){#hm{--ln:#8e918f;--tv:oklch(.33 .05 150);--tf:oklch(.33 .05 235);--tg:oklch(.35 .05 85)}}
body:has(nav.hide) #hm{--b:calc(env(safe-area-inset-bottom) + 8px)}
#hm [hidden]{display:none!important}
#hm [data-k=f]{--t:var(--tf)}#hm [data-k=g]{--t:var(--tg)}
#hm button{padding:0;border:0;background:none;font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}

#hm .cb{position:sticky;top:0;z-index:4;display:flex;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 8px) 24px 8px;overflow-x:auto;background:var(--bg,#fff);scrollbar-width:none}
#hm .cb::-webkit-scrollbar{display:none}
#hm .cb button{flex:none;height:32px;padding:0 16px;border:1px solid var(--ln);border-radius:8px;font-weight:500;white-space:nowrap;transition:background-color .2s}
#hm .cb .on{border-color:transparent;background:var(--ct);color:var(--oc)}

#hm .ti{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:20px 16px 12px 24px}
#hm .ti h2{overflow:hidden;font:500 22px/28px "Google Sans",Roboto,"Noto Sans Bengali",system-ui,sans-serif;text-overflow:ellipsis;white-space:nowrap}
#hm .sa{display:grid;flex:none;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--su)}
#hm .sa svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

#hm .st{display:flex;gap:12px;padding:0 24px 8px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 24px;overscroll-behavior-x:contain;scrollbar-width:none}
#hm .st::-webkit-scrollbar{display:none}
#hm .st .c{flex:0 0 27.5vw;max-width:128px}
#hm .gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:20px 12px;padding:0 24px 8px}
#hm .em{padding:64px 16px;color:var(--mu);text-align:center}

#hm .c{min-width:0;scroll-snap-align:start;cursor:pointer;transition:transform .2s var(--e)}
#hm .c:active{transform:scale(.97)}
#hm .ph{position:relative;display:grid;place-items:center;aspect-ratio:1;overflow:hidden;border-radius:26%;background:var(--t,var(--tv));font-size:44px;line-height:1}
#hm .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s;pointer-events:none}
#hm .ph img.ok{opacity:1}
#hm .of{position:absolute;left:6px;top:6px;padding:2px 6px;border-radius:6px;background:var(--of);color:#fff;font:700 10px/14px Roboto,system-ui,sans-serif}
#hm .ad{position:absolute;right:6px;bottom:6px;display:flex;align-items:center;height:32px;border-radius:16px;background:var(--bg,#fff);box-shadow:0 1px 4px rgba(0,0,0,.3);color:var(--ac)}
#hm .ad button{display:grid;place-items:center;min-width:30px;height:32px;font:500 20px/1 Roboto,system-ui,sans-serif}
#hm .ad b{font:600 12px/1 Roboto,system-ui,sans-serif}
#hm .in .ad{background:var(--ac);color:var(--oa)}
#hm h3{margin-top:8px;overflow:hidden;font:500 14px/20px "Google Sans",Roboto,"Noto Sans Bengali",system-ui,sans-serif;text-overflow:ellipsis;white-space:nowrap}
#hm .en{display:-webkit-box;min-height:32px;overflow:hidden;color:var(--mu);font-size:12px;line-height:16px;-webkit-box-orient:vertical;-webkit-line-clamp:2}
#hm .pr{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 4px;margin-top:2px}
#hm .pr b{font:600 14px/20px Roboto,system-ui,sans-serif}
#hm .pr s,#hm .pr small{color:var(--mu);font-size:12px}

#hm .dk{position:fixed;z-index:3;left:12px;right:12px;bottom:var(--b);display:flex;align-items:center;gap:12px;max-width:616px;height:64px;margin:0 auto;padding:0 10px;border-radius:24px;background:var(--ct);color:var(--oc);box-shadow:0 2px 10px rgba(0,0,0,.22);opacity:0;pointer-events:none;transform:translateY(24px);transition:transform .35s var(--e),opacity .25s,bottom .35s var(--e)}
#hm .dk.on{opacity:1;pointer-events:auto;transform:none}
#hm .bi{position:relative;display:grid;flex:none;place-items:center;width:44px;height:44px;border-radius:16px;background:var(--ac);color:var(--oa)}
#hm .bi svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
#hm .bn{position:absolute;top:-4px;right:-6px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--oc);color:var(--ct);font:700 11px/18px Roboto,system-ui,sans-serif;text-align:center}
#hm .tx{flex:1;min-width:0}
#hm .tx b{display:block;font:700 18px/24px Roboto,system-ui,sans-serif}
#hm .tx small{display:block;height:16px;font-size:11px;line-height:16px;opacity:.8}
#hm .od{flex:none;height:44px;padding:0 20px;border-radius:22px;background:var(--ac);color:var(--oa);font-weight:500}
#hm .dk:not(.ok) .od{background:color-mix(in srgb,var(--oc) 12%,transparent);color:color-mix(in srgb,var(--oc) 40%,transparent)}

#hm .ts{position:fixed;z-index:7;left:12px;right:12px;bottom:calc(var(--b) + 72px);display:flex;justify-content:center;pointer-events:none;transition:bottom .35s var(--e)}
#hm .ts span{max-width:100%;padding:12px 16px;border-radius:12px;background:var(--fg,#1f1f1f);color:var(--bg,#fff);opacity:0;transform:translateY(8px);transition:opacity .2s,transform .3s var(--e)}
#hm .ts.on span{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){#hm *{transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="hm">
  <div class="cb">
    <button class="on" data-k="a">All</button>
    <button data-k="v">Vegetables</button>
    <button data-k="f">Fish</button>
    <button data-k="g">Grains</button>
  </div>
  <div class="mn"></div>
  <div class="gd" hidden></div>
  <p class="em" hidden>No items found</p>

  <div class="dk">
    <div class="bi"><svg viewBox="0 0 24 24"><path d="M5 8h14l-1.2 11.2A2 2 0 0 1 15.8 21H8.2a2 2 0 0 1-2-1.8zM9 8V6.5a3 3 0 0 1 6 0V8"/></svg><b class="bn">0</b></div>
    <div class="tx"><b></b><small></small></div>
    <button class="od" aria-disabled="true">Order</button>
  </div>
  <div class="ts" role="status" aria-live="polite"><span></span></div>
</div>

<script>
(()=>{
const MIN=150,
/* bengali|transliteration|english|low|high|unit|emoji|category|wikipedia title ; MRP = round((low+high)/2), sale price = MRP / 2 */
R=`আলু|Alu|Potato (Chandramukhi / Jyoti)|31|36|kg|🥔|v|Potato
পেঁয়াজ|Piyaj|Red Onion (Big)|58|69|kg|🧅|v|Red onion
ছোট পেঁয়াজ|Chhachi Piyaj ছাঁচি পেঁয়াজ|Small Onion / Shallot|70|83|kg|🧅|v|Shallot
টমেটো|Tomato|Tomato (Local / Hybrid)|35|42|kg|🍅|v|Tomato
কাঁচা লঙ্কা|Kacha Lanka|Green Chilli|59|70|kg|🌶️|v|Chili pepper
বিট|Beet|Beetroot|34|40|kg|🍠|v|Beetroot
কাঁচকলা|Kanchkola|Raw Banana / Plantain|12|14|kg|🍌|v|Cooking banana
নটে শাক|Note Shak|Amaranth Leaves|8|9|kg|🥬|v|Amaranthus tricolor
আমলকী|Amloki|Indian Gooseberry / Amla|83|98|kg|🍏|v|Phyllanthus emblica
চালকুমড়ো|Chalkumro|Ash Gourd|20|23|kg|🍈|v|Wax gourd
বেবি কর্ন|Baby Corn|Baby Corn|42|49|kg|🌽|v|Baby corn
মোচা|Mocha|Plantain / Banana Flower|17|20|kg|🌷|v|Banana flower
ক্যাপসিকাম|Capsicum|Green Capsicum / Bell Pepper|51|60|kg|🌶️|v|Bell pepper
করলা / উচ্ছে|Korola Uchhe|Bitter Gourd|42|49|kg|🥒|v|Momordica charantia
লাউ|Lau|Bottle Gourd|28|33|kg|🍐|v|Calabash
মাখম শিম|Makham Shim|Butter Beans|46|55|kg|🥜|v|Lima bean
শিম|Shim|Broad Beans / Fava Beans|42|49|kg|🌱|v|Vicia faba
বাঁধাকপি|Bandhakopi|Cabbage|28|33|kg|🥬|v|Cabbage
গাজর|Gajor|Carrot|36|43|kg|🥕|v|Carrot
ফুলকপি|Phulkopi|Cauliflower|34|40|kg|🥦|v|Cauliflower
ঝাড় শিম|Jhar Shim|Cluster Beans|41|48|kg|🌱|v|Guar
নারকেল|Narkel|Fresh Coconut|61|72|kg|🥥|v|Coconut
কচু পাতা|Kochu Pata|Colocasia / Taro Leaves|15|18|kg|🍃|v|Taro
গাঠি কচু|Gathi Kochu|Colocasia / Taro Roots|28|33|kg|🥔|v|Taro
ধনে পাতা|Dhone Pata|Coriander / Cilantro Leaves|12|14|kg|🌿|v|Coriander
ভুট্টা|Bhutta|Sweet Corn|31|36|kg|🌽|v|Sweet corn
শশা|Shosha|Cucumber|29|34|kg|🥒|v|Cucumber
কারিপাতা|Kari Pata|Curry Leaves|36|43|kg|🌿|v|Curry tree
শুলফা শাক|Shulpha Shak|Dill Leaves|13|16|kg|🌿|v|Dill
সজনে ডাঁটা|Sojne Data|Drumsticks / Moringa|72|85|kg|🥒|v|Moringa oleifera
বেগুন|Begun|Brinjal / Eggplant|34|40|kg|🍆|v|Eggplant
বেগুন বড়|Boro Begun|Brinjal (Big / Bharta)|73|86|kg|🍆|v|Eggplant
ওল কচু|Ol Kochu|Elephant Foot Yam|39|46|kg|🌰|v|Amorphophallus paeoniifolius
মেথি শাক|Methi Shak|Fenugreek Leaves (Methi)|10|12|kg|🌿|v|Fenugreek
ফ্রেঞ্চ বিনস|French Beans|French Beans / Green Beans|62|73|kg|🌱|v|Green bean
রসুন|Rosun|Garlic|154|182|kg|🧄|v|Garlic
আদা|Ada|Ginger|131|155|kg|🌰|v|Ginger
পেঁয়াজ পাতা|Piyaj Pata|Spring Onion / Green Onion|33|39|kg|🌿|v|Scallion
মটরশুঁটি|Motor Shuti|Green Peas|54|64|kg|🌱|v|Pea
কুঁদরি|Kundri|Ivy Gourd / Scarlet Gourd|33|39|kg|🥒|v|Coccinia grandis
পাতিলেবু|Pati Lebu|Lemon / Lime|99|117|kg|🍋|v|Lemon
কাঁচা আম|Kancha Aam|Raw Mango|85|100|kg|🥭|v|Mango
পুদিনা পাতা|Pudina Pata|Mint Leaves|6|7|bunch|🌿|v|Mentha
মাশরুম|Mushroom|Button Mushroom|78|92|kg|🍄|v|Agaricus bisporus
সরষে শাক|Sorshe Shak|Mustard Leaves|18|21|kg|🥬|v|Mustard greens
ঢেঁড়স|Dherosh|Okra / Ladies Finger|31|36|kg|🥒|v|Okra
মিষ্টি কুমড়ো|Mishti Kumro|Pumpkin|20|23|kg|🎃|v|Pumpkin
মূল|Mula|Radish (Daikon)|32|38|kg|🥕|v|Daikon
ঝিঙে|Jhinge|Ridge Gourd|39|46|kg|🥒|v|Luffa acutangula
চিচিঙ্গা|Chichinga|Snake Gourd|30|35|kg|🥒|v|Trichosanthes cucumerina
টকে পালং|Toke Palong|Sorrel Leaves|17|20|kg|🥬|v|Sorrel
পালং শাক|Palong Shak|Spinach|15|18|kg|🥬|v|Spinach
রাঙা আলু|Ranga Alu|Sweet Potato|36|43|kg|🍠|v|Sweet potato
কাঁকরোল|Kakrol|Teasel Gourd / Kakrol|40|40|kg|🥒|v|Momordica dioica
পটল|Potol|Pointed Gourd / Parwal|42|42|kg|🥒|v|Trichosanthes dioica
রুই মাছ|Rui Machh|Rohu Fish (Live / Fresh Cut)|239|329|kg|🐟|f|Rohu
কাতলা মাছ|Katla Machh|Catla / Katla Fish (Whole Cut / Peti)|299|549|kg|🐟|f|Catla
ইলিশ মাছ|Ilish Machh|Hilsa / Ilish Fish (Padma / Sundarbans)|850|1500|kg|🐟|f|Tenualosa ilisha
পাবদা মাছ|Pabda Machh|Pabda / Indian Butter Catfish|350|649|kg|🐠|f|Ompok pabda
ট্যাংরা মাছ|Tangra Machh|Tangra Catfish (Sundarbans Riverine)|479|949|kg|🐠|f|Mystus
গলদা চিংড়ি|Golda Chingri|Freshwater Giant Prawn (Scampi)|829|850|kg|🦐|f|Macrobrachium rosenbergii
মৌরলা মাছ|Mourola Machh|Mourola (Small Carplet Fish)|409|420|kg|🐠|f|Amblypharyngodon mola
ভেটকি মাছ|Bhetki Machh|Asian Sea Bass / Vetki (Whole / Fillet)|699|799|kg|🐟|f|Barramundi
আড় মাছ|Aar Machh|Aar Catfish (Headless / Whole)|599|798|kg|🐟|f|Sperata aor
চিতল মাছ|Chitol Machh|Clown Knifefish (Chitol Peti Cut)|1299|1299|kg|🐟|f|Chitala chitala
বাটা মাছ|Bata Machh|Fresh Bata Fish|200|299|kg|🐠|f|Labeo bata
শোল মাছ|Shol Machh|Snakehead Murrel / Live Shol|659|659|kg|🐟|f|Channa striata
গোবিন্দভোগ চাল|Gobindobhog Chal|Gobindobhog Aromatic Short-Grain Rice|75|168|kg|🍚|g|Gobindobhog rice
মিনিকেট চাল|Miniket Chal|Miniket Parboiled Medium-Grain Rice|34|40|kg|🌾|g|Parboiled rice
স্বর্ণা মনসুরী চাল|Swarna Mansoori|Swarna Mansoori Daily Grain Rice|22|30|kg|🌾|g|Rice`.split('\n').map(r=>{
  const f=r.split('|'),o=Math.round((+f[3]+ +f[4])/2);
  return{bn:f[0],en:f[2],o,p:Math.round(o/2),u:f[5],e:f[6],k:f[7],w:f[8],h:(f[0]+' '+f[1]+' '+f[2]).toLowerCase()}
}),
K=['v','f','g'],
TT={v:'সবজি',f:'মাছ',g:'শস্য'},
root=document.getElementById('hm'),$=s=>root.querySelector(s),$$=s=>[...root.querySelectorAll(s)],
fmt=n=>'₹'+Math.round(n).toLocaleString('en-IN'),
kg=p=>p.u==='kg',
lab=(p,q)=>kg(p)?(q<1000?q+'g':q/1000+'kg'):q+'pc',
sum=(p,q,r)=>kg(p)?Math.round(r*q/1000):r*q,
vib=()=>navigator.vibrate&&navigator.vibrate(8),
chips=$$('.cb button'),mn=$('.mn'),gd=$('.gd'),em=$('.em'),dk=$('.dk'),od=$('.od'),ts=$('.ts'),tx=$('.ts span'),
sc=root.closest('.pane')||document.scrollingElement,
cart=new Map(),ALL=R.map((_,i)=>i),idx=k=>ALL.filter(i=>R[i].k===k);
let total=0,toastT,LC={},view='a',qs='';

/* ---------- cards ---------- */
const ad=i=>{
  const q=cart.get(i);
  return q?`<button class="mi" aria-label="Less">−</button><b>${lab(R[i],q)}</b><button class="pl" aria-label="More">+</button>`:`<button class="pl" aria-label="Add">+</button>`;
},
card=i=>{
  const p=R[i];
  return `<article class="c${cart.has(i)?' in':''}" data-i="${i}" data-k="${p.k}" role="link" tabindex="0"><div class="ph"><span>${p.e}</span><i class="of">50% OFF</i><div class="ad">${ad(i)}</div></div><h3 lang="bn">${p.bn}</h3><p class="en">${p.en}</p><div class="pr"><b>${fmt(p.p)}</b><s>${fmt(p.o)}</s><small>/ ${p.u}</small></div></article>`;
},
place=()=>$$('.c:not(.pic)').forEach(c=>{
  const u=LC[R[c.dataset.i].w];if(!u)return;c.classList.add('pic');
  const im=new Image();im.alt='';im.draggable=false;im.onload=()=>im.classList.add('ok');im.onerror=()=>im.remove();im.src=u;c.querySelector('.ph').prepend(im);
});

/* ---------- sections and views ---------- */
mn.innerHTML=K.map(k=>`<section><div class="ti"><h2 lang="bn">${TT[k]}</h2><button class="sa" data-k="${k}" aria-label="Show all"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></div><div class="st">${idx(k).map(card).join('')}</div></section>`).join('');

const render=()=>{
  const grid=!!qs||view!=='a',ids=ALL.filter(i=>(view==='a'||R[i].k===view)&&R[i].h.includes(qs));
  gd.innerHTML=grid?`<div class="ti"><h2${qs?'':' lang="bn"'}>${qs?'Results':TT[view]}</h2></div><div class="gr">${ids.map(card).join('')}</div>`:'';
  mn.hidden=grid;gd.hidden=!grid;em.hidden=!(qs&&!ids.length);place();
},
setView=k=>{view=k;chips.forEach(c=>c.classList.toggle('on',c.dataset.k===k));render();sc.scrollTo({top:0})};
document.addEventListener('search',e=>{qs=String(e.detail).trim().toLowerCase();render()});

/* ---------- order dock ---------- */
const toast=m=>{tx.textContent=m;ts.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>ts.classList.remove('on'),2600)},
paint=()=>{
  dk.classList.toggle('on',cart.size>0);
  try{localStorage.setItem('gh.cart',JSON.stringify([...cart].map(([i,q])=>[R[i].bn,q])))}catch{}
  if(!cart.size)return;
  let t=0,mrp=0;cart.forEach((q,i)=>{t+=sum(R[i],q,R[i].p);mrp+=sum(R[i],q,R[i].o)});total=t;
  const ok=t>=MIN;
  $('.tx b').textContent=fmt(t);
  $('.tx small').textContent=ok?'You save '+fmt(mrp-t):'Add '+fmt(MIN-t)+' more';
  $('.bn').textContent=cart.size;dk.classList.toggle('ok',ok);od.setAttribute('aria-disabled',!ok);
},
set=(i,q)=>{
  q>0?cart.set(i,q):cart.delete(i);
  $$('.c[data-i="'+i+'"]').forEach(c=>{c.classList.toggle('in',q>0);c.querySelector('.ad').innerHTML=ad(i)});
  paint();
},
order=()=>{
  if(total<MIN)return toast(`Minimum order is ${fmt(MIN)}. Add ${fmt(MIN-total)} more.`);
  const items=[...cart].map(([i,q])=>{const p=R[i];return{name:p.bn,en:p.en,qty:kg(p)?q/1000:q,unit:p.u,mrp:p.o,rate:p.p,amount:sum(p,q,p.p)}});
  document.dispatchEvent(new CustomEvent('order',{detail:{items,total}}));toast('Order request sent');
};
document.addEventListener('ordered',()=>[...cart.keys()].forEach(i=>set(i,0)));

/* ---------- clicks ---------- */
root.addEventListener('click',e=>{
  const t=e.target;
  if(t.closest('.od'))return order();
  const ch=t.closest('.cb button,.sa');if(ch)return setView(ch.dataset.k);
  const c=t.closest('.c');if(!c)return;
  const i=+c.dataset.i,p=R[i],q=cart.get(i)||0,s=kg(p)?500:1;
  if(t.closest('.pl')){set(i,Math.min(q+s,kg(p)?10000:20));vib()}
  else if(t.closest('.mi')){set(i,q-s);vib()}
  else location.href='/products?'+encodeURIComponent(p.en);
});
root.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList.contains('c'))e.target.click()});

/* ---------- boot: saved bag + product photos (Wikipedia thumbnails, cached 30 days) ---------- */
try{JSON.parse(localStorage.getItem('gh.cart')||'[]').forEach(([n,q])=>{const i=R.findIndex(p=>p.bn===n);if(i>-1&&q>0)set(i,q)})}catch{}
(async()=>{
  try{const j=JSON.parse(localStorage.getItem('gh.img')||'null');if(j&&Date.now()-j.t<2592e6)LC=j.d}catch{}
  place();
  const need=[...new Set(R.map(p=>p.w))].filter(w=>!(w in LC));
  for(let n=0;n<need.length;n+=50){
    const ch=need.slice(n,n+50);
    try{
      const j=await(await fetch('https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&redirects=1&prop=pageimages&piprop=thumbnail&pithumbsize=360&pilimit=50&titles='+ch.map(encodeURIComponent).join('%7C'))).json(),
      q=j.query||{},N={},D={},P={};
      (q.normalized||[]).forEach(x=>N[x.from]=x.to);(q.redirects||[]).forEach(x=>D[x.from]=x.to);
      Object.values(q.pages||{}).forEach(x=>P[x.title]=x.thumbnail&&x.thumbnail.source);
      ch.forEach(w=>{const f=N[w]||w;LC[w]=P[D[f]||f]||''});
    }catch{}
  }
  try{localStorage.setItem('gh.img',JSON.stringify({t:Date.now(),d:LC}))}catch{}
  place();
})();
})();
</script>
