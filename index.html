<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8f9ff" media="(prefers-color-scheme:light)">
<meta name="theme-color" content="#12141a" media="(prefers-color-scheme:dark)">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Green Store">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Home</title>
<style>
/* palette taken from the icon: royal blue -> periwinkle, sky-blue handle, white leaf */
:root{color-scheme:light dark;--p:#1a6bf0;--on-p:#fff;--bg:#f8f9ff;--fg:#191c24;--sf:#eaf0fe;--sc:#d3e3ff;--on-sc:#001b44;--mut:#4a5265;--ease:cubic-bezier(.2,0,0,1);--spring:cubic-bezier(.34,1.56,.64,1);--hh:calc(60px + env(safe-area-inset-top));--nh:calc(60px + env(safe-area-inset-bottom))}
@media(prefers-color-scheme:dark){:root{--p:#a9c7ff;--on-p:#00316e;--bg:#12141a;--fg:#e3e2ea;--sf:#1e222c;--sc:#254a8a;--on-sc:#d8e6ff;--mut:#b4bccd}}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font:16px/1.5 Roboto,system-ui,sans-serif;background:var(--bg);color:var(--fg)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--p);outline-offset:2px}

/* panes slide + fade like Android shared-axis transitions */
.pane{position:fixed;inset:0;overflow-y:auto;overscroll-behavior:contain;padding:var(--hh) 0 var(--nh);opacity:0;visibility:hidden;pointer-events:none;transform:translateX(6%);transition:opacity .25s var(--ease),transform .35s var(--ease),visibility .35s}
.pane.l{transform:translateX(-6%)}
.pane.on{opacity:1;visibility:visible;pointer-events:auto;transform:none}

header,nav{position:fixed;left:0;right:0;z-index:5;will-change:transform;transition:transform .35s var(--ease),background-color .25s,box-shadow .25s}
header{top:0;padding-top:env(safe-area-inset-top);background:var(--bg)}
header.lift,header.s.lift{background:var(--sf)}
header.hide{transform:translateY(-100%)}
nav{bottom:0;height:var(--nh);padding-bottom:env(safe-area-inset-bottom);display:flex;background:var(--sf)}
nav.hide{transform:translateY(100%)}

.bar{height:60px;display:flex;align-items:center;gap:12px;padding:0 8px 0 16px;transition:opacity .2s,transform .35s var(--ease),visibility .2s}
.logo{width:36px;height:36px;border-radius:11px;object-fit:contain;animation:pop .6s var(--spring) both}
h1{font:600 20px/24px Roboto,system-ui,sans-serif;letter-spacing:-.2px;animation:slide .5s .1s var(--ease) both}
#so{margin-left:auto}
#b2{position:absolute;left:12px;right:12px;bottom:6px;height:48px;padding:0 4px;border-radius:24px;background:var(--sc);color:var(--on-sc);opacity:0;visibility:hidden;transform:scaleX(.85) translateY(6px);transform-origin:right center;gap:0}
.s #b1{opacity:0;visibility:hidden}
.s #b2{opacity:1;visibility:visible;transform:none}
#q{flex:1;min-width:0;height:100%;padding:0 8px;border:0;background:none;color:inherit;font:inherit;outline:0}
#q::placeholder{color:inherit;opacity:.6}
#q::-webkit-search-cancel-button{display:none}
#b2:has(#q:placeholder-shown) #sc{visibility:hidden;transform:scale(.5)}

.ib{position:relative;overflow:hidden;display:grid;place-items:center;width:44px;height:44px;border:0;border-radius:50%;background:none;color:var(--mut);cursor:pointer;transition:transform .2s var(--spring),background-color .2s}
.ib:active{transform:scale(.88)}
#b2 .ib{color:inherit}

.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding-top:8px;border:0;background:none;color:var(--mut);font:500 11px/14px Roboto,system-ui,sans-serif;cursor:pointer;transition:color .2s}
.tab.on{color:var(--fg)}
.pill{position:relative;overflow:hidden;display:grid;place-items:center;width:56px;height:28px;border-radius:14px;transition:transform .2s var(--spring)}
.tab:active .pill{transform:scale(.9)}
.pill::before{content:"";position:absolute;inset:0;background:var(--sc);opacity:0;transform:scaleX(.3);transition:transform .4s var(--spring),opacity .2s}
.tab.on .pill{color:var(--on-sc)}
.tab.on .pill::before{opacity:1;transform:none}
.pill svg{position:relative;width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round;stroke-linecap:round;transition:transform .4s var(--spring)}
.tab.on .pill svg{transform:translateY(-1px) scale(1.08)}
.f{transition:fill .25s}
.tab.on .f{fill:currentColor}

.r{position:absolute;border-radius:50%;background:currentColor;opacity:.2;transform:scale(0);animation:rp .6s ease-out forwards;pointer-events:none}
/* loader = the app icon, breathing */
.ld{width:56px;height:56px;margin:30vh auto 0;background:url(/assets/icon.png) center/contain no-repeat;animation:br 1.1s ease-in-out infinite}
.er{margin:30vh 16px 0;text-align:center;color:var(--mut)}
.er button{margin-top:12px;height:40px;padding:0 24px;border:0;border-radius:20px;background:var(--p);color:var(--on-p);font-weight:500;cursor:pointer;transition:transform .2s var(--spring)}
.er button:active{transform:scale(.94)}

@keyframes rp{to{transform:scale(1);opacity:0}}
@keyframes br{50%{transform:scale(1.15) rotate(-6deg);opacity:.7}}
@keyframes pop{from{transform:scale(.4) rotate(-20deg);opacity:0}}
@keyframes slide{from{transform:translateX(-12px);opacity:0}}
@view-transition{navigation:auto}
::view-transition-old(root){animation:.3s cubic-bezier(.3,0,.8,.15) both out}
::view-transition-new(root){animation:.4s var(--ease) both in}
@keyframes out{to{transform:translateX(-25%);opacity:0}}
@keyframes in{from{transform:translateX(100%)}}
@media(prefers-reduced-motion:reduce){*,::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<header>
  <div class="bar" id="b1">
    <img class="logo" src="/assets/icon.png" alt="Logo" width="36" height="36" fetchpriority="high">
    <h1>Green Store</h1>
    <button class="ib" id="so" aria-label="Search"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg></button>
  </div>
  <div class="bar" id="b2">
    <button class="ib" id="sx" aria-label="Back"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20z"/></svg></button>
    <input id="q" type="search" placeholder="Search" aria-label="Search" enterkeyhint="search" autocomplete="off">
    <button class="ib" id="sc" aria-label="Clear"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button>
  </div>
</header>
<main>
  <section class="pane" data-src="home.html"></section>
  <section class="pane" data-src="orders.html"></section>
</main>
<nav aria-label="Primary">
  <button class="tab"><span class="pill"><svg viewBox="0 0 24 24"><path class="f" d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg></span>Home</button>
  <button class="tab"><span class="pill"><svg viewBox="0 0 24 24"><path class="f" d="M5 8h14l-1 12a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1z"/><path d="M9 8V7a3 3 0 0 1 6 0v1"/></svg></span>Orders</button>
</nav>
<script>
const $=s=>document.querySelector(s),hd=$('header'),nv=$('nav'),q=$('#q'),tabs=[...document.querySelectorAll('.tab')],panes=[...document.querySelectorAll('.pane')],idle=window.requestIdleCallback||setTimeout;
let cur=-1,y0=0;

document.addEventListener('pointerdown',e=>{
  const b=e.target.closest('.tab,.ib');if(!b)return;
  const t=b.querySelector('.pill')||b,r=t.getBoundingClientRect(),d=Math.max(r.width,r.height)*2,s=document.createElement('span');
  s.className='r';s.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;
  t.appendChild(s);s.onanimationend=()=>s.remove();
},{passive:true});

const bars=on=>{if(!hd.classList.contains('s'))hd.classList.toggle('hide',!on);nv.classList.toggle('hide',!on)};
addEventListener('scroll',e=>{
  const p=e.target;if(p!==panes[cur])return;
  const y=p.scrollTop,d=y-y0;
  hd.classList.toggle('lift',y>0);
  if(Math.abs(d)>8||y<1){bars(d<0||y<64);y0=y}
},{capture:true,passive:true});

async function load(p){
  p.dataset.s=1;p.innerHTML='<div class="ld"></div>';
  try{
    const r=await fetch(p.dataset.src);if(!r.ok)throw 0;
    const d=new DOMParser().parseFromString(await r.text(),'text/html');
    p.replaceChildren(...[...d.head.children].filter(n=>/^(STYLE|LINK|SCRIPT)$/.test(n.tagName)),...d.body.childNodes);
    p.querySelectorAll('script').forEach(o=>{const s=document.createElement('script');for(const a of o.attributes)s.setAttribute(a.name,a.value);s.text=o.text;o.replaceWith(s)});
  }catch{
    p.innerHTML='<div class="er"><p>Couldn\'t load this page</p><button>Retry</button></div>';
    p.querySelector('button').onclick=()=>load(p);
  }
}

function go(i){
  const p=panes[i];
  if(i===cur){p.scrollTo({top:0,behavior:'smooth'});return bars(true)}
  cur=i;
  tabs.forEach((t,k)=>{t.classList.toggle('on',k===i);t.ariaCurrent=k===i?'page':'false'});
  panes.forEach((x,k)=>{x.classList.toggle('on',k===i);x.classList.toggle('l',k<i)});
  if(!p.dataset.s)load(p);
  document.title=tabs[i].textContent;
  y0=p.scrollTop;hd.classList.toggle('lift',y0>0);bars(true);
}
tabs.forEach((t,i)=>t.onclick=()=>go(i));
go(location.hash==='#orders'?1:0);
idle(()=>panes.forEach(p=>p.dataset.s||load(p)));

const emit=()=>document.dispatchEvent(new CustomEvent('search',{detail:q.value.trim()})),
ss=on=>{hd.classList.toggle('s',on);if(on)q.focus();else{q.value='';q.blur();emit()}};
$('#so').onclick=()=>{history.pushState({s:1},'');ss(true)};
$('#sx').onclick=()=>history.back();
$('#sc').onclick=()=>{q.value='';emit();q.focus()};
q.oninput=emit;
q.onkeydown=e=>{if(e.key==='Escape')history.back()};
onpopstate=()=>{if(hd.classList.contains('s'))ss(false)};
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{scope:'./'}).catch(console.error));
</script>
</body>
</html>
